name: Deploy Dev (VPS Mallol)

on:
  push:
    branches: [main]

# Los deploys hacen fila en vez de pisarse: dos merges seguidos lanzaban
# dos veces deploy.sh a la vez sobre el mismo Odoo y se mataban entre sí
# (exit 137). cancel-in-progress: false = ninguno se descarta, esperan turno.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy al VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.156.249.105
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash /root/odoo-v19-surtidora/deploy.sh
