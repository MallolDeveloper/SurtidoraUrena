name: Deploy Dev (VPS Mallol)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy al VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.156.249.105
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash /root/odoo-v19-surtidora/deploy.sh
